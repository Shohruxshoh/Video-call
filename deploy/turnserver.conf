# coturn for Aloqa (runs from docker-compose.yml with host networking).
# The shared secret, realm and server name are passed on the command line from .env.

listening-port=3478
min-port=49160
max-port=49999

# Short-lived credentials issued by the Node server (/api/ice), signed with the shared secret.
use-auth-secret

# Plain TURN over UDP and TCP on 3478 is enough here; TLS on another port rarely gets
# through networks that block 3478 anyway.
no-tls

# If the VPS sits behind NAT (its network card has a private IP), uncomment and set:
# external-ip=PUBLIC_IP

fingerprint
stale-nonce=600
no-multicast-peers

# Protect the 1-CPU server: cap each relayed stream and the number of sessions.
max-bps=1000000
total-quota=60
user-quota=6

# Never relay into private networks (protects the server's own network and Docker).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
